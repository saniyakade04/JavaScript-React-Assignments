name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build all assignments into one site
        run: |
          mkdir -p _site
          cp index.html _site/
          for dir in Assignment-*/; do
            name="${dir%/}"
            mkdir -p "_site/$name"
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm install && npm run build)
              if [ -d "$dir/dist" ]; then out="dist"; else out="build"; fi
              cp -r "$dir/$out/." "_site/$name/"
            else
              cp -r "$dir/." "_site/$name/"
            fi
          done
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4